# Tool configuration only. Dependencies live in requirements.txt so that the
# repository has a single dependency-management method.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
# The investigation graph and the service are async, so the suite drives them
# with pytest-asyncio in auto mode: an `async def test_*` needs no marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
